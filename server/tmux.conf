# Tmux config for the K12 Claude Code LXC.
# Lives in this repo at lxc/105-claude-code/tmux.conf and is symlinked
# to /root/.tmux.conf on the LXC. Apply changes to running sessions:
#   tmux source-file /root/.tmux.conf
#
# Theme:  Catppuccin Mocha
# Glyphs: Nerd Font (install CaskaydiaCove NF / JetBrainsMono NF or any
#         "*Nerd Font" variant in the local terminal that SSHes in).
#         Without a Nerd Font the icons render as boxes; everything else
#         still works.
#
# ============================================================================
# CHEATSHEET (when SSH'd into a Claude session via `ssh claude-<instance>`)
# ============================================================================
#
# Default prefix is Ctrl+b. Most tmux commands start with it.
#
# DETACH (leave Claude running, exit terminal):    Ctrl+b then d
# REATTACH from terminal:                          ssh claude-<instance>
#                                                  (or `tmux a -t claude-<x>` on the LXC)
# LIST sessions:                                   tmux ls (on the LXC)
#
# SCROLLING:                                       scroll wheel (mouse mode on)
#                                                  OR Ctrl+b [ then PgUp/PgDn, q to exit
# COPY text:                                       click + drag (auto-copies)
#
# SPLIT pane vertically:                           Ctrl+b then |
# SPLIT pane horizontally:                         Ctrl+b then -
# SWITCH between panes:                            Alt+arrow keys (no prefix needed)
# CLOSE a pane:                                    type `exit` (or Ctrl+d)
#
# RELOAD this config after editing:                Ctrl+b then r
#
# !!! NEVER Ctrl+C inside Claude !!!
# That kills the Claude process. Use Ctrl+b then d to safely detach.
# ============================================================================

# --- Quality of life ---------------------------------------------------------

# Mouse on - scroll wheel scrolls history, click to select pane, drag to resize
set -g mouse on

# Bigger scrollback (default 2000 is too small for long Claude sessions)
set -g history-limit 50000

# 256-color terminal + true color (so Claude TUI + Catppuccin render correctly)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# OSC 52 clipboard bridge: when something is copied inside tmux (mouse
# drag-end, or `y` in copy-mode), tmux emits an escape sequence that the
# outer terminal (Windows Terminal, iTerm2, WezTerm, kitty etc.) catches
# and pushes into the host OS clipboard - so Ctrl+V on the Windows side
# pastes what you selected here. tmux's set-clipboard default is
# "external" already, but it only fires if the terminfo entry advertises
# the Ms capability - which tmux-256color does NOT by default. Force it
# for all outer terminal types.
set -ga terminal-overrides ',*:Ms=\E]52;c;%p2%s\7'

# Renumber windows when one closes (no gaps in the list)
set -g renumber-windows on

# Don't automatically rename windows after I've named them manually
set-window-option -g allow-rename off

# Pass through xterm Ctrl+arrow / Ctrl+Backspace etc. so word-by-word
# editing in shells / Claude works as expected
set-window-option -g xterm-keys on

# Refresh the status bar every 5s (instance count + clock stay fresh)
set -g status-interval 5

# Push session name to the outer terminal as the window/tab title.
# Sessions are named claude-<instance>; we strip the "claude-" prefix and
# replace it with "lxc-" so a tab attached to claude-homelab shows up as
# "lxc-homelab" in Windows Terminal / iTerm / etc. Works via OSC 0/2
# escape sequences that any modern terminal emulator picks up.
#
# Implementation note: tmux's inline regex form `#{s/.../.../:#S}` was
# tried first but silently returned an empty title in tmux 3.3a on this
# host, so we use the shell-command form instead - bulletproof across
# tmux versions.
set -g set-titles on
# %%s escapes the literal "%s" through tmux's strftime layer (a single %s
# would expand to the current unix epoch at format time, leaving printf
# with no format code and a stray arg). #S expands to the session name,
# then sed rewrites the claude- prefix.
set -g set-titles-string '#(printf %%s "#S" | sed s/^claude-/lxc-/)'

# Drop tmux's default 500ms escape-key timeout so Alt+key sequences (like
# Claude Code's Alt+V to paste an image) are recognised promptly. Without
# this, tmux waits 500ms after ESC to see if a sequence follows, which
# breaks Alt+letter combos coming from Windows Terminal / xterm.
set -s escape-time 10

# --- Memorable key bindings --------------------------------------------------

# Easier-to-remember split bindings:
#   Ctrl+b |  splits the current pane vertically
#   Ctrl+b -  splits the current pane horizontally
# Both inherit the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation with Alt+arrow (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Reload config: Ctrl+b r
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# --- Catppuccin Mocha palette ------------------------------------------------

thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_subtext="#a6adc8"
thm_overlay="#6c7086"
thm_surface0="#313244"
thm_surface1="#45475a"

thm_blue="#89b4fa"
thm_lavender="#b4befe"
thm_sapphire="#74c7ec"
thm_sky="#89dceb"
thm_teal="#94e2d5"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_peach="#fab387"
thm_red="#f38ba8"
thm_mauve="#cba6f7"
thm_pink="#f5c2e7"

# --- Status bar (Catppuccin Mocha + powerline) -------------------------------
#
# Powerline glyphs:    (U+E0B0 hard right) /  (U+E0B2 hard left)
# Nerd Font icons used:
#   󰒋  server / host
#     terminal / session
#   󰣇  instance count (cube)
#     clock
#     calendar

set -g status-position bottom
set -g status-justify left
set -g status-style "fg=${thm_fg},bg=${thm_bg}"
set -g status-left-length 120
set -g status-right-length 120

# Left:   host    session
set -g status-left "\
#[fg=${thm_bg},bg=${thm_mauve},bold] 󰒋 #h \
#[fg=${thm_mauve},bg=${thm_surface1},nobold]\
#[fg=${thm_sapphire},bg=${thm_surface1}]   #S \
#[fg=${thm_surface1},bg=${thm_bg}] "

# Right:  󰣇 N inst    HH:MM    DAY DD-MON
set -g status-right "\
#[fg=${thm_surface1},bg=${thm_bg}]\
#[fg=${thm_peach},bg=${thm_surface1}] 󰣇 #(systemctl list-units 'claude-remote@*.service' --state=active --no-legend --plain 2>/dev/null | wc -l) inst \
#[fg=${thm_mauve},bg=${thm_surface1}]\
#[fg=${thm_bg},bg=${thm_mauve},bold]   %H:%M \
#[fg=${thm_lavender},bg=${thm_mauve}]\
#[fg=${thm_bg},bg=${thm_lavender},bold]   %a %d-%b "

# Inactive windows
set -g window-status-format \
"#[fg=${thm_overlay},bg=${thm_bg}]  #I:#W  "

# Active window: blue powerline pill
set -g window-status-current-format "\
#[fg=${thm_bg},bg=${thm_blue}]\
#[fg=${thm_bg},bg=${thm_blue},bold] #I:#W \
#[fg=${thm_blue},bg=${thm_bg}]"

# Window with bell / activity notice
set -g window-status-bell-style "fg=${thm_red},bg=${thm_bg},bold"

# Powerline glyphs ARE the separators - no extra space between segments
set -g window-status-separator ""

# --- Pane borders + messages -------------------------------------------------

set -g pane-border-style        "fg=${thm_surface1}"
set -g pane-active-border-style "fg=${thm_mauve}"

set -g message-style          "fg=${thm_sky},bg=${thm_surface1}"
set -g message-command-style  "fg=${thm_sky},bg=${thm_surface1}"

# Mode indicator (copy-mode / choose-tree highlight) - subtle
set -g mode-style "fg=${thm_bg},bg=${thm_mauve}"

# Clock mode (Ctrl+b t) tinted
set -g clock-mode-colour "${thm_mauve}"


# --- Fix OSC 52 clipboard for Windows Terminal via SSH -----------------------
# tmux set-clipboard external should handle this automatically, but the
# chain (Windows Terminal -> SSH -> tmux 3.3a) drops the sequence in
# practice. This explicit copy-pipe writes OSC 52 directly to every
# attached client TTY, which SSH faithfully relays to Windows Terminal.
set -g allow-passthrough on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel /usr/local/bin/osc52-copy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel /usr/local/bin/osc52-copy
